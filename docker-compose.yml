name: apex-rag

services:
  db:
    # Development-only credentials. Do not use these in production.
    image: pgvector/pgvector:pg16
    container_name: apex-rag-db
    environment:
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: apex
      POSTGRES_DB: apex
    ports:
      - "5432:5432"
    volumes:
      - apex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex -d apex"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    container_name: apex-rag-api
    profiles: ["api"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DSN: postgresql://apex:apex@db:5432/apex
      BACKEND: postgres
      EMBEDDING_PROVIDER: sentence-transformers
      EMBEDDING_MODEL: /models/bge-large-en-v1.5
      EMBEDDING_DIM: "1024"
      EMBEDDING_DEVICE: cpu
      RERANKER_PROVIDER: heuristic
      KMP_DUPLICATE_LIB_OK: "TRUE"
    volumes:
      - ./data/models:/models:ro
      - ./data:/app/data:ro
      - ./reports:/app/reports

volumes:
  apex_pgdata:

